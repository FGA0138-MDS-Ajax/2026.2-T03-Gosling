name: Backend CI
on:
  push:
    branches: [main, developer, "feature/**", "fix/**"]
  pull_request:
    branches: [developer, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar codigo
        run: python -m ruff check app tests
      - name: Verificar formatacao
        run: python -m ruff format --check app tests
      - name: Executar testes e medir cobertura
        run: python -m pytest
      - name: Salvar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: src/backend/coverage.xml
          if-no-files-found: ignore