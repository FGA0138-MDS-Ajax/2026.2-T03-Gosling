name: Backend CI

on:
  push:
    branches: [main, developer, "feature/**", "fix/**"]
  pull_request:
    branches: [developer, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: volunja_test
          MYSQL_USER: volunja
          MYSQL_PASSWORD: teste_mysql_123
          MYSQL_ROOT_PASSWORD: teste_root_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --protocol=TCP -h 127.0.0.1 -uvolunja -pteste_mysql_123 volunja_test -e 'SELECT 1' --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://volunja:teste_mysql_123@127.0.0.1:3306/volunja_test
      TEST_DATABASE_URL: mysql+pymysql://volunja:teste_mysql_123@127.0.0.1:3306/volunja_test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar codigo
        run: python -m ruff check app tests migrations
      - name: Verificar formatacao
        run: python -m ruff format --check app tests migrations
      - name: Aplicar migracoes no MySQL de teste
        run: python -m alembic upgrade head
      - name: Executar testes e medir cobertura
        run: python -m pytest
      - name: Salvar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend
          path: src/backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  fluxo-autenticacao:
    name: fluxo-autenticacao
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_ROOT_PASSWORD: teste_root_123
      MYSQL_PASSWORD: teste_mysql_123
      JWT_SECRET_KEY: chave-exclusiva-do-ci-sem-dados-reais-1234567890
      DEMO_PASSWORD: SenhaDeTeste123!
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Iniciar sistema com MySQL e Nginx
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Criar contas ficticias
        run: docker compose exec -T -e DEMO_PASSWORD api python -m app.usuarios.seed
      - run: npm ci
        working-directory: src/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend
      - name: Testar fluxos e limite de tentativas no proxy
        run: npm run test:e2e
        working-directory: src/frontend
      - name: Salvar evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-autenticacao
          path: |
            src/frontend/test-results
            src/frontend/playwright-report
          if-no-files-found: ignore
      - name: Logs do sistema
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose down
