site_name: VolunJá — Grupo Gosling
site_description: Documentação do produto e do projeto VolunJá, desenvolvido na disciplina MDS em 2026.2.
site_url: https://fga0138-mds-ajax.github.io/2026.2-T03-Gosling/
repo_url: https://github.com/FGA0138-MDS-Ajax/2026.2-T03-Gosling
repo_name: FGA0138-MDS-Ajax/2026.2-T03-Gosling

nav:
  - Início: index.md
  - Atas de Reunião:
      - Ata 1: atas-reuniao/ata-reuniao-1.md
      - Ata 2: atas-reuniao/ata-reuniao-2.md
  - Documentos:
      - Documento de Visão: visão.md
      - Documento de Arquitetura: arquitetura.md
  - Testes de Software:
      - Plano e cobertura: testes.md
      - Autenticação e acesso: testes/autenticacao.md
      - Cadastros e perfis: testes/cadastros-perfis.md
      - Publicação e gestão de vagas: testes/vagas.md
      - Regressões da revisão: testes/regressoes.md
      - Testes de sistema: testes/sistema.md
  - Acompanhamento:
      - Sprints e métricas: sprints.md
      - Débitos técnicos: debitos-tecnicos.md
      - Tratamento da inspeção: inspecao.md
theme:
  name: material
  language: pt
  features:
    - navigation.top
    - toc.integrate
    - toc.follow

plugins:
  - search:
      lang: pt

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 2
